name: Build section pages
on:
  push:
    branches: [main]
    paths: ["index.html", "tools/build-pages.mjs", "tools/build-prayer-pages.mjs", "tools/build-hub-pages.mjs", "tools/prayers/**", "tools/hubs/**", "data/prayers/**", "data/hubs/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-pages.mjs
      - run: node tools/build-prayer-pages.mjs
      - run: node tools/build-hub-pages.mjs
      - name: Commit regenerated pages
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Regenerate section, prayer and content pages"
            git push
          fi
